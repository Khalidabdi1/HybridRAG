<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="vision" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fae8ff"/><stop offset="1" stop-color="#f5d0fe"/>
    </linearGradient>
    <linearGradient id="skip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fee2e2"/><stop offset="1" stop-color="#fecaca"/>
    </linearGradient>
  </defs>

  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Selective Pixel Indexing</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#64748b">Render + tile + embed a page into vision only when it earns it — saving storage &amp; GPU</text>

  <!-- Page -->
  <rect x="40" y="180" width="150" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="115" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Page</text>
  <text x="115" y="232" text-anchor="middle" font-size="11" fill="#475569">text / html / image</text>

  <!-- Richness scorer -->
  <rect x="250" y="160" width="200" height="120" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="350" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Richness score</text>
  <text x="350" y="210" text-anchor="middle" font-size="11" fill="#78350f">tables · ruled lines</text>
  <text x="350" y="228" text-anchor="middle" font-size="11" fill="#78350f">colour · mid-tones</text>
  <text x="350" y="246" text-anchor="middle" font-size="11" fill="#78350f">numeric grids · media tags</text>
  <text x="350" y="268" text-anchor="middle" font-size="11" font-style="italic" fill="#92400e">score ≥ threshold ?</text>

  <line x1="190" y1="220" x2="248" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Always indexed: text -->
  <rect x="540" y="60" width="320" height="70" rx="12" fill="url(#text)" stroke="#3b82f6" opacity="0.9"/>
  <text x="560" y="88" font-size="13" font-weight="700" fill="#1d4ed8">TEXT INDEX — always</text>
  <text x="560" y="110" font-size="11" fill="#1e3a8a">every page is chunked + embedded (cheap, fast, easy to update)</text>
  <line x1="450" y1="200" x2="538" y2="120" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Rich -> vision -->
  <rect x="540" y="160" width="320" height="70" rx="12" fill="url(#vision)" stroke="#a855f7"/>
  <text x="560" y="188" font-size="13" font-weight="700" fill="#7e22ce">VISION INDEX — if rich</text>
  <text x="560" y="210" font-size="11" fill="#6b21a8">screenshot → tiles → VLM embeddings (tables, charts, layout)</text>
  <line x1="450" y1="210" x2="538" y2="195" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495" y="180" font-size="11" font-weight="700" fill="#16a34a">rich ✓</text>

  <!-- Not rich -> skip -->
  <rect x="540" y="270" width="320" height="80" rx="12" fill="url(#skip)" stroke="#ef4444"/>
  <text x="560" y="298" font-size="13" font-weight="700" fill="#b91c1c">SKIP vision — text-native</text>
  <text x="560" y="320" font-size="11" fill="#7f1d1d">prose · code · logs · JSON → no render, no tiles, no GPU</text>
  <text x="560" y="338" font-size="11" fill="#7f1d1d">no screenshot/tile storage</text>
  <line x1="450" y1="250" x2="538" y2="300" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="492" y="290" font-size="11" font-weight="700" fill="#b91c1c">sparse ✗</text>

  <text x="450" y="410" text-anchor="middle" font-size="12" fill="#64748b">pixel_selection = auto · always · never   ·   hybridrag richness --file page.html</text>
</svg>
