<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="vision" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fae8ff"/><stop offset="1" stop-color="#f5d0fe"/>
    </linearGradient>
  </defs>

  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">HybridRAG Architecture</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#64748b">One document, indexed across two modalities, fused at query time</text>

  <!-- Source -->
  <rect x="40" y="110" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="115" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Source Document</text>
  <text x="115" y="160" text-anchor="middle" font-size="11" fill="#475569">Web / PDF / Image</text>

  <!-- TEXT branch -->
  <rect x="260" y="95" width="600" height="120" rx="12" fill="url(#text)" stroke="#3b82f6" opacity="0.35"/>
  <text x="278" y="118" font-size="13" font-weight="700" fill="#1d4ed8">TEXT PIPELINE</text>
  <rect x="270" y="130" width="120" height="60" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="330" y="155" text-anchor="middle" font-size="12" fill="#0f172a">Extract</text>
  <text x="330" y="172" text-anchor="middle" font-size="10" fill="#475569">HTML/PDF → text</text>
  <rect x="410" y="130" width="120" height="60" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="470" y="155" text-anchor="middle" font-size="12" fill="#0f172a">Chunk</text>
  <text x="470" y="172" text-anchor="middle" font-size="10" fill="#475569">overlap windows</text>
  <rect x="550" y="130" width="120" height="60" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="610" y="155" text-anchor="middle" font-size="12" fill="#0f172a">Text Embed</text>
  <text x="610" y="172" text-anchor="middle" font-size="10" fill="#475569">MiniLM / E5</text>
  <rect x="690" y="130" width="150" height="60" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="765" y="155" text-anchor="middle" font-size="12" fill="#0f172a">Text Index</text>
  <text x="765" y="172" text-anchor="middle" font-size="10" fill="#475569">FAISS / numpy</text>

  <!-- VISION branch -->
  <rect x="260" y="305" width="600" height="120" rx="12" fill="url(#vision)" stroke="#a855f7" opacity="0.35"/>
  <text x="278" y="328" font-size="13" font-weight="700" fill="#9333ea">PIXEL PIPELINE</text>
  <rect x="270" y="340" width="120" height="60" rx="8" fill="#ffffff" stroke="#a855f7"/>
  <text x="330" y="365" text-anchor="middle" font-size="12" fill="#0f172a">Render</text>
  <text x="330" y="382" text-anchor="middle" font-size="10" fill="#475569">screenshot</text>
  <rect x="410" y="340" width="120" height="60" rx="8" fill="#ffffff" stroke="#a855f7"/>
  <text x="470" y="365" text-anchor="middle" font-size="12" fill="#0f172a">Tile</text>
  <text x="470" y="382" text-anchor="middle" font-size="10" fill="#475569">overlap slices</text>
  <rect x="550" y="340" width="120" height="60" rx="8" fill="#ffffff" stroke="#a855f7"/>
  <text x="610" y="365" text-anchor="middle" font-size="12" fill="#0f172a">Vision Embed</text>
  <text x="610" y="382" text-anchor="middle" font-size="10" fill="#475569">Qwen-VL / CLIP</text>
  <rect x="690" y="340" width="150" height="60" rx="8" fill="#ffffff" stroke="#a855f7"/>
  <text x="765" y="365" text-anchor="middle" font-size="12" fill="#0f172a">Vision Index</text>
  <text x="765" y="382" text-anchor="middle" font-size="10" fill="#475569">FAISS / numpy</text>

  <!-- connectors source to branches -->
  <path d="M190,150 C 220,150 220,160 258,160" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M190,150 C 220,150 220,370 258,370" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- internal arrows text -->
  <path d="M390,160 L408,160" stroke="#3b82f6" marker-end="url(#arrow)"/>
  <path d="M530,160 L548,160" stroke="#3b82f6" marker-end="url(#arrow)"/>
  <path d="M670,160 L688,160" stroke="#3b82f6" marker-end="url(#arrow)"/>
  <!-- internal arrows vision -->
  <path d="M390,370 L408,370" stroke="#a855f7" marker-end="url(#arrow)"/>
  <path d="M530,370 L548,370" stroke="#a855f7" marker-end="url(#arrow)"/>
  <path d="M670,370 L688,370" stroke="#a855f7" marker-end="url(#arrow)"/>

  <!-- Query + Router + Fusion -->
  <rect x="40" y="240" width="150" height="50" rx="10" fill="#fef9c3" stroke="#eab308"/>
  <text x="115" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#854d0e">Query</text>
  <text x="115" y="280" text-anchor="middle" font-size="10" fill="#854d0e">"revenue table?"</text>

  <rect x="40" y="430" width="220" height="60" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text x="150" y="455" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Query Router</text>
  <text x="150" y="474" text-anchor="middle" font-size="10" fill="#166534">picks per-modality weights</text>

  <rect x="690" y="240" width="170" height="50" rx="10" fill="#fee2e2" stroke="#ef4444"/>
  <text x="775" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">RRF Fusion</text>
  <text x="775" y="280" text-anchor="middle" font-size="10" fill="#b91c1c">merge + rerank by doc</text>

  <!-- query to router -->
  <path d="M115,290 L130,428" stroke="#64748b" marker-end="url(#arrow)"/>
  <!-- router influences both indices (dashed) -->
  <path d="M260,455 C 500,455 760,430 775,292" fill="none" stroke="#22c55e" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <!-- indices to fusion -->
  <path d="M840,190 C 880,200 880,235 800,242" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M840,360 C 880,330 880,290 800,278" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <!-- fusion to results -->
  <rect x="690" y="430" width="170" height="55" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="775" y="455" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Ranked Results</text>
  <text x="775" y="473" text-anchor="middle" font-size="10" fill="#475569">text + image evidence</text>
  <path d="M775,290 L775,428" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
